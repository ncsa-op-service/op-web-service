services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: line_checker_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: line_checker_backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://postgres:password@postgres:5432/line_checker
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: line_checker_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: line_checker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d line_checker
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: